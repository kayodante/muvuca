name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  # Everything that needs nothing but the dependency tree. No browser
  # download, no Docker, no build -- so a lint or type error reports back
  # without first paying for a Chromium download and a Supabase stack.
  quality:
    name: Quality (lint, types, unit, supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The store is content-addressed and every package is verified against
      # the integrity hashes in pnpm-lock.yaml, so a restored entry cannot
      # substitute different content for a locked version. `node_modules` is
      # deliberately NOT cached: it is a materialized view of the lockfile and
      # a stale one silently diverges from `--frozen-lockfile`.
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Format check
        run: pnpm format:check
      - name: Dependency audit
        # Ignored advisories (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq) are
        # documented and pinned in pnpm-workspace.yaml (auditConfig).
        run: pnpm audit --audit-level=high
      - name: Audit package signatures
        run: pnpm audit signatures
      - name: Repository hygiene
        run: pnpm check:hygiene

  # Everything that needs a browser, a database or a production build. These
  # were three jobs that each re-downloaded Chromium, re-started Supabase or
  # rebuilt the app; sharing one runner pays for each exactly once.
  integration:
    name: Integration (RLS, build, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Overrides the workflow-level placeholders: `NEXT_PUBLIC_*` values are
    # inlined at `next build` time, so this build must point at the local
    # Supabase stack. These are the local stack's public values, identical on
    # every machine -- no secret is involved.
    #
    # The app URL must carry the E2E port (playwright.config.ts, E2E_PORT),
    # not the dev server's 3000: Playwright starts `next start` on the E2E
    # port, and a workflow-level 3000 here used to leave the suite waiting on
    # a port nothing was listening on until the job timed out.
    env:
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3210"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Playwright E2E launches the full Chromium build (`devices["Desktop
      # Chrome"]`).
      #
      # No `--no-shell`/`--only-shell`: plain `chromium` installs the full
      # build and chromium-headless-shell, and both are needed depending on
      # how a run launches the browser. `playwright install --dry-run
      # chromium` lists both.
      #
      # The binaries are not cached on purpose: a Playwright cache has to be
      # keyed on the exact package version, and a key that drifts restores a
      # browser revision the client refuses to launch -- a confusing
      # "Executable doesn't exist" failure in exchange for one bounded
      # download per run. The timeout below is the cheaper protection.
      - name: Install Chromium for E2E
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: pnpm exec playwright install --with-deps chromium
      # Magic-link E2E needs auth + Mailpit (127.0.0.1:54324), so the full
      # local stack is started here. The same stack then serves the pgTAP
      # suite.
      - name: Start Supabase local stack
        run: pnpm exec supabase start
      # `supabase status -o env` also prints the service-role/secret key, so it
      # is never echoed: the value is only matched, never printed.
      - name: Verify local publishable key
        run: |
          pnpm exec supabase status -o env | grep -qF "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Local publishable key differs from NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .github/workflows/ci.yml"
            exit 1
          }
      - name: Reset database from migrations
        run: pnpm exec supabase db reset
      # pgTAP cases roll back, so E2E below still starts from the reset state.
      - name: RLS and invariant tests (pgTAP)
        run: pnpm exec supabase test db
      - name: Build
        run: pnpm build
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Os jobs acima só aplicam migrations a um banco local efêmero, que é
  # destruído junto com o runner -- nada neles toca o projeto de produção.
  # Sem este job, uma migration mergeada fica só no repo e o schema remoto
  # diverge em silêncio até alguém abrir a feature que depende dela: foi
  # assim que 0026, 0027 e 0028 ficaram semanas para trás e a coluna
  # `library_items.language` da 0028 quebrou os itens de código em produção
  # com o código novo já no ar.
  #
  # O deploy do app é da integração Git do Vercel e roda em paralelo com o
  # CI, não depois dele: entre o app subir e este job aplicar as migrations
  # há uma janela de alguns minutos com código novo sobre schema velho.
  # Tolerável porque as migrations do repo são aditivas por padrão e
  # `__tests__/migrations-destructive.test.ts` falha o CI quando deixam de
  # ser -- o problema que este job resolve é a migration que nunca chega,
  # não a que chega tarde.
  migrate:
    name: Apply migrations (production)
    # Nunca aplica um schema que o CI não validou.
    needs: [quality, integration]
    # `push` + `main` mantém o job fora dos PRs. A checagem de repositório
    # deixa o fork de um terceiro herdar o workflow sem nunca disparar um
    # deploy: quem forkar aponta esta linha para o próprio repo (e o
    # processo manual equivalente está em docs/DEPLOY.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kayodante/muvuca'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exige aprovação manual antes de qualquer step rodar. `supabase db
    # push` é irreversível na prática e o Free Tier não tem PITR nem backup
    # automático (docs/DEPLOY.md): a única volta é o JSON exportado antes.
    # Os três secrets abaixo pertencem a este environment, não ao
    # repositório, então nenhum outro job do workflow os enxerga.
    environment: Production
    # O grupo de concurrency do topo cancela o run anterior a cada push
    # novo. Um `db push` interrompido no meio de uma migration é exatamente
    # o que não pode acontecer, então este job usa um grupo próprio, que
    # enfileira em vez de cancelar.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    # Os secrets são declarados step a step, nunca no nível do job: um
    # `env:` aqui os colocaria também no ambiente de `pnpm install`, que
    # executa build scripts de dependências -- um postinstall
    # comprometido leria a senha do Postgres de produção. Só os três
    # últimos steps precisam deles.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # Instala o repo inteiro só para usar o CLI do Supabase, em vez de
      # baixá-lo por uma action separada: assim a versão que aplica o schema
      # de produção é exatamente a que `pnpm-lock.yaml` trava e o job
      # `integration` acima já exercitou. Com o store em cache o custo é
      # pequeno, e uma versão de CLI divergindo da testada não é.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Link Supabase project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Registra no log exatamente o que falta aplicar, imediatamente antes
      # de aplicar. Não substitui a aprovação (o environment já barrou o job
      # antes deste ponto), mas deixa o run auditável depois.
      - name: Pending migrations (dry run)
        run: pnpm exec supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply migrations
        run: pnpm exec supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
